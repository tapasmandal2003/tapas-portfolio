<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>404 | Page Not Found - Tapas Mandal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090909;
  color: #f5f1e9;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 550px;
}

h1 {
  font-size: 120px;
  color: #d7ad62;
  line-height: 1;
}

h2 {
  font-size: 28px;
  margin: 20px 0 12px;
}

p {
  color: #aaa39a;
  line-height: 1.7;
  margin-bottom: 30px;
}

a {
  display: inline-block;
  background: #d7ad62;
  color: #090909;
  padding: 13px 28px;
  border-radius: 5px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

a:hover {
  background: #f2d49a;
  transform: translateY(-3px);
}

.brand {
  margin-top: 45px;
  color: #d7ad62;
  letter-spacing: 4px;
  font-size: 13px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <h1>404</h1>

  <h2>Oops! Page Not Found</h2>

  <p>
    The page you are looking for might have been removed,
    renamed, or is temporarily unavailable.
  </p>

  <a href="/">Back to Homepage</a>

  <div class="brand">TAPAS MANDAL</div>

</div>

</body>
</html>
